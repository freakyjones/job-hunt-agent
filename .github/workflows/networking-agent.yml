name: Zero-Cost Networking Agent

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Allows manual trigger from UI
    inputs:
      command:
        description: 'Command to run'
        required: false
        default: 'all'
      user_id:
        description: 'User ID triggering the workflow'
        required: false
      user_email:
        description: 'User email triggering the workflow'
        required: false

jobs:
  run-networking-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link User ID
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.user_id != '' }}
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://job-hunt-agent.vercel.app' }}
          CI_INTERNAL_TOKEN: ${{ secrets.CI_INTERNAL_TOKEN }}
        run: |
          curl -X POST "$NEXT_PUBLIC_APP_URL/api/webhooks/github/link-user" \
          -H "Authorization: Bearer $CI_INTERNAL_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"run_id\": ${{ github.run_id }}, \"user_id\": \"${{ github.event.inputs.user_id }}\", \"workflow_name\": \"${{ github.workflow }}\"}"
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Networking Agent
        run: pnpm --filter @job-hunt/networking-worker start
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
